name: Engine, desktop and evidence ledger
on:
  push:
  pull_request:
jobs:
  r-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
      - name: Install engine dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify pinned R runtime and execute R tool integration test (a skip fails the job)
        run: |
          Rscript --version
          python scripts/run_gated_tests.py r-runtime

  spark-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install engine dependencies and PySpark
        run: python -m pip install -r requirements-dev.txt pyspark==4.0.1
      - name: Execute Apache Spark Code integration test (a skip fails the job)
        run: python scripts/run_gated_tests.py spark-runtime

  llm-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Cache the Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-0.5b
      - name: Install Ollama and a small local model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 30); do curl -s http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull qwen2.5:0.5b
      - name: Execute the AI tools against the real local model (a skip fails the job)
        env:
          FLOWBENCH_OLLAMA_URL: http://127.0.0.1:11434/v1
          FLOWBENCH_OLLAMA_MODEL: qwen2.5:0.5b
        run: python scripts/run_gated_tests.py llm-runtime

  service-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine dependencies, the Hyper API, and ODBC with the SQLite driver
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q unixodbc libsqliteodbc
          python -m pip install -r requirements-dev.txt pyodbc tableauhyperapi
      - name: Start an S3-compatible server that checks signatures (SeaweedFS) and MongoDB 7.0
        run: |
          mkdir -p "$RUNNER_TEMP/s3cfg"
          echo '{"identities":[{"name":"fbtest","credentials":[{"accessKey":"fbtestkey","secretKey":"fbtestsecret123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3cfg/s3.json"
          docker run -d --name fb-seaweed -p 127.0.0.1:18333:8333 -v "$RUNNER_TEMP/s3cfg:/cfg:ro" chrislusf/seaweedfs:3.97 server -s3 -s3.config=/cfg/s3.json -dir=/data -master.volumeSizeLimitMB=16 -volume.max=40
          docker run -d --name fb-mongo -p 127.0.0.1:27018:27017 -e MONGO_INITDB_ROOT_USERNAME=fbtest -e MONGO_INITDB_ROOT_PASSWORD=fbtestsecret123 mongo:7.0
          for i in $(seq 60); do curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18333/ | grep -q '403\|200' && break; sleep 2; done
          for i in $(seq 60); do docker exec fb-mongo mongosh --quiet -u fbtest -p fbtestsecret123 --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1 && break; sleep 2; done
          sleep 3
      - name: Execute S3 and MongoDB integration tests (a skip fails the job)
        env:
          FLOWBENCH_S3_ENDPOINT: http://127.0.0.1:18333
          FLOWBENCH_S3_KEY: fbtestkey
          FLOWBENCH_S3_SECRET: fbtestsecret123
          FLOWBENCH_MONGO_HOST: 127.0.0.1
          FLOWBENCH_MONGO_PORT: '27018'
          FLOWBENCH_MONGO_USER: fbtest
          FLOWBENCH_MONGO_PASSWORD: fbtestsecret123
          FLOWBENCH_ODBC_SQLITE_DRIVER: SQLite3
        run: python scripts/run_gated_tests.py service-integration

  database-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database drivers and engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Start isolated PostgreSQL and SQL Server fixtures
        run: python tests/integration/db_env.py up
      - name: Exercise real database connectivity and cross-engine workflows
        run: python -m unittest discover -s tests/integration -p 'test_*integration.py' -v
      - name: Remove database containers
        if: always()
        run: python tests/integration/db_env.py down

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The evidence ledger executes the R kernel test while deriving tool
      # status. Match the dedicated runtime job so this generated status is
      # reproducible in CI as well as on developer machines.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate catalogue records
        run: python scripts/validate_repository.py
      - name: Unit, property, integration, interop, service and golden tests
        run: python -m unittest discover -s tests -v
      - name: Real end-to-end run through the CLI (golden outputs)
        run: |
          python -m flowengine validate examples/sales/monthly_sales.flow.json
          python -m flowengine run examples/sales/monthly_sales.flow.json --clock 2026-01-15T09:30:00 --log run-events.jsonl --manifest run-manifest.json
          diff examples/sales/out/monthly_sales.csv tests/golden/monthly_sales/monthly_sales.csv
          diff examples/sales/out/unmatched_orders.csv tests/golden/monthly_sales/unmatched_orders.csv
          python -m flowengine run examples/sales/monthly_sales.flow.json --clock 2026-01-15T09:30:00 --batch-rows 3 --workers 2
          diff examples/sales/out/monthly_sales.csv tests/golden/monthly_sales/monthly_sales.csv
      - name: Import an original .yxmd fixture
        run: python -m flowengine import tests/fixtures/yxmd/regional_sales.yxmd -o imported.flow.json
      - name: Legacy testbed smoke test
        run: python -m engine.independent_engine examples/customer_reconciliation.json
      - name: Status ledger and contracts are reproducible from evidence
        run: python scripts/build_status.py --check
      - name: Full parity roadmap matches catalogue and evidence ledger
        run: python scripts/build_parity_roadmap.py --check
      - name: Generated tracked reports are stable
        run: |
          python scripts/coverage_report.py
          python scripts/generate_test_matrix.py
          git diff --exit-code docs/COVERAGE.md data/test-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-evidence
          path: |
            run-events.jsonl
            run-manifest.json

  text-addons:
    runs-on: ubuntu-latest
    env:
      FLOWENGINE_HOME: ${{ github.workspace }}/.flowbench-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .flowbench-ci
          key: text-addons-${{ runner.os }}-${{ hashFiles('flowengine/addons.py') }}
      - name: Install the first-use components through the product's own installer
        run: python -m flowengine addons install spacy-model:english spacy-model:german zero-shot-model ocr-models image-model:mobilenet_v2
      - name: Text and vision tools on the real spaCy, ONNX zero-shot, PaddleOCR and MobileNetV2 models
        run: python -m unittest discover -s tests/integration -p "test_*_addons_integration.py" -v

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -r ../requirements.txt
      - run: npm ci
      - name: Type-check and unit tests
        run: |
          npx tsc --noEmit -p .
          npx vitest run
      - name: End-to-end UI tests against the real engine
        run: |
          npx playwright install --with-deps chromium
          npx playwright test app.spec

  desktop-shell:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard the desktop acceptance credential helper environment
        shell: pwsh
        run: ./tests/integration/test_copy_reader_password.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: desktop
      - name: Assemble the pinned bundled Windows runtime
        shell: pwsh
        run: ./desktop/scripts/package_windows_runtime.ps1
      - name: First-use language pack installs from the bundled Windows runtime and tags text
        shell: pwsh
        run: |
          $env:FLOWENGINE_HOME = Join-Path $env:RUNNER_TEMP 'flowbench-addons'
          $py = (Resolve-Path desktop/src-tauri/runtime/python.exe).Path
          $repo = (Get-Location).Path
          & $py -c "import sys, runpy; sys.path.insert(0, r'$repo'); sys.argv = ['flowengine', 'addons', 'install', 'spacy-model:english']; runpy.run_module('flowengine', run_name='__main__')"
          if ($LASTEXITCODE -ne 0) { throw 'Add-on installation from the bundled runtime failed' }
          & $py -c "import sys, json; sys.path.insert(0, r'$repo'); sys.path.insert(0, r'$repo\tests'); from helpers import ROOT, edge, text_input, workflow; from flowengine.executor import run_workflow; r = run_workflow(workflow([text_input('d', [('text', 'v_wstring')], [['Apple opened an office in London.']]), {'id': 'n', 'tool': 'core.named_entity_recognition', 'config': {'text_field': 'text'}}], [edge('d', 'output', 'n', 'input')]), base_dir=ROOT); assert r.ok, r.error; labels = [e['label'] for e in json.loads(r.output('n').column('entities')[0])]; print(labels); assert 'ORG' in labels and 'GPE' in labels"
          if ($LASTEXITCODE -ne 0) { throw 'Named Entity Recognition through the bundled runtime failed' }
      - name: Rust shell tests (sidecar protocol incl. real engine round trip)
        working-directory: desktop/src-tauri
        run: |
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          cargo test
      - name: Build self-contained Windows NSIS installer
        working-directory: desktop
        run: npm run tauri -- build
      - name: Install, launch without system runtimes, upgrade and uninstall
        shell: pwsh
        run: ./desktop/scripts/windows_installer_smoke.ps1
      - name: Publish clean-runner installer evidence
        uses: actions/upload-artifact@v4
        with:
          name: flowbench-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Attach the installer to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
