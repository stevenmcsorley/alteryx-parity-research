[package]
name = "flowbench"
version = "1.0.0-rc.3"
description = "Flowbench desktop workflow editor (independent implementation)"
authors = ["Flowbench contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flowbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
open = "5"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"

[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2"
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
