[package]
name = "flowbench"
version = "0.2.0"
description = "Flowbench desktop workflow editor (independent implementation)"
authors = ["alteryx-parity-research contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flowbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
